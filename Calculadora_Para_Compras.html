<script>

        var indi =1;
        var IniNom;
        var IniCant;
        var IniPrec;
        var IniRes;
        $(document).ready(function(){
            IniNom = $(".cajasnompro").html();
            IniCant = $(".cajascantidad").html();
            IniPrec = $(".cajaprecio").html();
            IniRes = $(".cajaresultado").html();
    $("#Add").click(function(){
                indi = indi+1;
        $(".cajasnompro").append(" <input type='text' placeholder='Nombre del producto'>");
                $(".cajascantidad").append(" <input type='number'  class='cant' placeholder='Cant' onkeyup='Resultado("+indi+")'>");
                $(".cajaprecio").append(" <input type='number'  class='precio' placeholder='Prec' onkeyup='Resultado("+indi+")' >");
                $(".cajaresultado").append(" <input type='number'  class='resultado'>");
    });
    loadData();
});
         function Resultado(posi){
                 var precio = document.getElementsByClassName('precio');
                 var cantidad = document.getElementsByClassName('cant');
                  var resultado = document.getElementsByClassName('resultado');
                 var p = parseFloat(precio[posi].value) || 0;
                 var c = parseFloat(cantidad[posi].value) || 0;
                 if(c <= 0){
                     cantidad[posi].style.borderColor = 'red';
                 }else{
                     cantidad[posi].style.borderColor = '';
                 }
                 if(p < 0){
                     precio[posi].style.borderColor = 'red';
                 }else{
                     precio[posi].style.borderColor = '';
                 }
                 var cost =  p * c;
                 resultado[posi].value= cost ? cost.toFixed(2) : '';
                 CalcularTotal();
                 saveData();
         }
	
function CalcularTotal(){
var Precios=document.getElementsByClassName('resultado');
var CantidadDePrecios =Precios.length;
var suma =0;
 for (var i = 0; i < CantidadDePrecios; i++) {
           var Price=Precios[i].value;
           if (Price=='') {
              Price=0;
                suma+=parseFloat(Price);
           }
           else {
              suma+=parseFloat(Price);
           }
 }
 resultado="S/"+suma.toFixed(5);
 document.getElementById('resultado').innerHTML=resultado;
 saveData();
}

function LimpiarCampos(){
    $(".cajasnompro").html(IniNom);
    $(".cajascantidad").html(IniCant);
    $(".cajaprecio").html(IniPrec);
    $(".cajaresultado").html(IniRes);
    indi = 1;
    document.getElementById('resultado').innerHTML = '0.00';
    localStorage.clear();
}

function saveData(){
    var nombres = $(".cajasnompro input").map(function(){return this.value;}).get();
    var cantidades = $(".cajascantidad input").map(function(){return this.value;}).get();
    var precios = $(".cajaprecio input").map(function(){return this.value;}).get();
    localStorage.setItem('nombres', JSON.stringify(nombres));
    localStorage.setItem('cantidades', JSON.stringify(cantidades));
    localStorage.setItem('precios', JSON.stringify(precios));
    localStorage.setItem('total', document.getElementById('resultado').innerHTML);
}

function loadData(){
    var nombres = JSON.parse(localStorage.getItem('nombres') || '[]');
    var cantidades = JSON.parse(localStorage.getItem('cantidades') || '[]');
    var precios = JSON.parse(localStorage.getItem('precios') || '[]');
    var max = Math.max(nombres.length, cantidades.length, precios.length);
    for(var i=2; i<max; i++){
        $("#Add").click();
    }
    $(".cajasnompro input").each(function(i){ if(nombres[i]) this.value = nombres[i]; });
    $(".cajascantidad input").each(function(i){ if(cantidades[i]) { this.value = cantidades[i]; Resultado(i); } });
    $(".cajaprecio input").each(function(i){ if(precios[i]) { this.value = precios[i]; Resultado(i); } });
    var tot = localStorage.getItem('total');
    if(tot){ document.getElementById('resultado').innerHTML = tot; }
}

function CambiaFondo(TheBtn){
    var Btn = document.getElementsByClassName('BtnCont');
    Btn[TheBtn].style.background = '#205396'; 
    Btn[TheBtn].style.color = 'white';   
}
function ReiniciaFondo(TheBtn){
    var Btn = document.getElementsByClassName('BtnCont');
    Btn[TheBtn].style.background = '#3B5999';
     Btn[TheBtn].style.color = 'white';   
}
	
</script>

<body>
  <div id="contenedor">
    <div id="contenido">
  <header>
  <a href="http://frank.pe/">  <img src="/imagenes/icono-frank.png" id="logo"></a>
    <h1 class="LogoT"> Frank.pe </h1>

  </header>
  <form id="FrmLista">
    <h2 class="titulos">Ingrese los productos que comprará</h2>
    <div  class="Contecajas">
     <div class="cajasnompro">
      <h3 class="titulos">Productos</h3>
      <input type="text" placeholder="Nombre del producto"  >
      <input type="text" placeholder="Nombre del producto"  >
     </div>
     <div class="cajascantidad">
     <h3 class="titulos">cantidad</h3>
      <input type="number"  class="cant" onkeyup="Resultado(0)" placeholder="Cant" >
      <input type="number"  class="cant" onkeyup="Resultado(1)" placeholder="Cant">
      </div>
      <div class="cajaprecio">
     <h3 class="titulos">Pre Und</h3>
      <input type="number"  class="precio" onkeyup="Resultado(0)" placeholder="Prec" >
      <input type="number"  class="precio" onkeyup="Resultado(1)" placeholder="Prec" >
    </div>
     <div class="cajaresultado">
     <h3 class="titulos">Resultado</h3>
      <input type="number"  class="resultado"  >
      <input type="number" class="resultado"  >
    </div>
	  </div>
 <div class="controles">
 <input type="button" value="CALCULAR" onclick="CalcularTotal()" class="BtnCont" onmousedown="CambiaFondo('0')" onmouseup="ReiniciaFondo('0')">
 <input type="button" value="ABREGAR MAS PRODUCTOS" id="Add" class="BtnCont" onmousedown="CambiaFondo('1')" onmouseup="ReiniciaFondo('1')">
 <input type="button" value="LIMPIAR" onclick="LimpiarCampos()" class="BtnCont" onmousedown="CambiaFondo('2')" onmouseup="ReiniciaFondo('2')">
 <label>Total :</label><label  id="resultado">0.00</label>
 </div>
  </form>
